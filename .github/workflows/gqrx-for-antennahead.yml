name: Gqrx for AntennaHead

# Builds "Gqrx for AntennaHead" — official Gqrx source + the three open
# remote-control PRs (#1463 filter shape, #1464 bookmarks, #1446 device
# control), combined on this branch — into per-arch .dmg files.
#
# Modelled on gqrx-sdr/gqrx .github/workflows/build.yml (job `macos`).
# Without signing secrets it still runs and uploads an ad-hoc / unsigned
# DMG artifact. With the secrets below it Developer-ID-signs, notarizes,
# and staples, and a `gfa-*` tag additionally publishes a GitHub Release.
#
# Required repo secrets for signed + notarized output:
#   BUILD_CERTIFICATE_BASE64  base64 of a Developer ID Application .p12
#   P12_PASSWORD              that .p12's export password
#   KEYCHAIN_PASSWORD         any throwaway string
#   SIGN_IDENTITY             signing identity or Team ID for `codesign --sign`
#   NOTARIZE_USERNAME         Apple ID email
#   NOTARIZE_TEAM_ID          10-char Team ID
#   NOTARIZE_PASSWORD         notarytool app-specific password
#
# Refresh note: this workflow file lives on the `gqrx-for-antennahead`
# branch. That branch is rebuilt from scratch on every refresh
# (`git switch -C … upstream/master && git merge --no-ff …`), so
# re-add / cherry-pick this file (and any branding patch) afterward.

on:
  push:
    branches: [gqrx-for-antennahead]
    tags: ['gfa-*']
  workflow_dispatch:

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    steps:
      - name: Check for signing secret availability
        id: secret-check
        run: |
          if [ -n "${{ secrets.BUILD_CERTIFICATE_BASE64 }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install conda dependencies
        id: setup-micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gqrx
          create-args: >-
            c-compiler
            cxx-compiler
            cmake
            make
            pkg-config
            gnuradio-core
            gnuradio-osmosdr
            libboost-devel
            qt6-main
            soapysdr
            soapysdr-module-audio
            soapysdr-module-lms7
            soapysdr-module-plutosdr
            soapysdr-module-remote
            soapysdr-module-volk-converters
            volk

      - name: Install Apple certificate
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -d -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force || true
          V="$(git describe --tags --always 2>/dev/null | sed 's/^v//')"
          [ -n "$V" ] || V="0.0.0-$(git rev-parse --short HEAD)"
          echo "GFA_VER=$V" >> "$GITHUB_ENV"
          echo "version = $V"

      - name: Configure
        shell: bash -el {0}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Compile
        shell: bash -el {0}
        working-directory: build
        run: make -j4

      # Runs AFTER Configure so gqrx's own `git describe --long --dirty`
      # (in CMakeLists.txt) sees a clean tree — otherwise the sed below
      # marks the working copy dirty and the app version gets a "-dirty".
      - name: Rebrand macos_bundle.sh
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY || secrets.NOTARIZE_TEAM_ID }}
        run: |
          # emit "Gqrx-for-AntennaHead.app" with our identity/name/version,
          # keeping every other line of the upstream script intact.
          sed -i '' \
            -e "s#^IDENTITY=.*#IDENTITY=${SIGN_IDENTITY}#" \
            -e "s#\$(<build/version.txt)#${GFA_VER}#" \
            -e 's#<string>dk\.gqrx\.gqrx</string>#<string>com.dsward.gqrx-for-antennahead</string>#' \
            -e 's#^  <string>Gqrx</string>#  <string>Gqrx for AntennaHead</string>#' \
            -e 's#Gqrx\.app#Gqrx-for-AntennaHead.app#g' \
            macos_bundle.sh
          echo "--- patched header ---"; sed -n '1,35p' macos_bundle.sh

      - name: Build app bundle
        shell: bash -el {0}
        env:
          CONDA_PREFIX: ${{ steps.setup-micromamba.outputs.environment-path }}
        run: ./macos_bundle.sh ${{ steps.secret-check.outputs.available }}

      - name: Ad-hoc sign (no signing secrets)
        if: ${{ steps.secret-check.outputs.available != 'true' }}
        run: |
          # macos_bundle.sh strips signatures in its no-secret path and
          # macdeployqt doesn't seal the bundle — re-sign ad-hoc so the app
          # at least has a valid (if unnotarized) signature.
          codesign --force --deep --sign - --timestamp=none Gqrx-for-AntennaHead.app
          codesign --verify --deep --strict --verbose=2 Gqrx-for-AntennaHead.app

      - name: Notarize app bundle
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        env:
          NOTARIZE_USERNAME: ${{ secrets.NOTARIZE_USERNAME }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          ditto -c -k --keepParent Gqrx-for-AntennaHead.app Gqrx-for-AntennaHead.zip
          xcrun notarytool submit Gqrx-for-AntennaHead.zip \
            --apple-id "$NOTARIZE_USERNAME" --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_PASSWORD" --wait

      - name: Staple app bundle
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: xcrun stapler staple --verbose Gqrx-for-AntennaHead.app

      - name: Create DMG
        run: |
          VER="${GFA_VER#v}"
          STAGE="$RUNNER_TEMP/dmg"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R Gqrx-for-AntennaHead.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create "Gqrx-for-AntennaHead-$VER-${{ matrix.arch }}.dmg" \
            -srcfolder "$STAGE" -format UDZO -fs HFS+ \
            -volname "Gqrx for AntennaHead $VER" -ov
          echo "GFA_DMG=Gqrx-for-AntennaHead-$VER-${{ matrix.arch }}.dmg" >> "$GITHUB_ENV"

      - name: Notarize DMG
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        env:
          NOTARIZE_USERNAME: ${{ secrets.NOTARIZE_USERNAME }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: |
          xcrun notarytool submit "$GFA_DMG" \
            --apple-id "$NOTARIZE_USERNAME" --team-id "$NOTARIZE_TEAM_ID" \
            --password "$NOTARIZE_PASSWORD" --wait

      - name: Staple DMG
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: xcrun stapler staple --verbose "$GFA_DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gqrx-for-antennahead-${{ matrix.arch }}
          path: Gqrx-for-AntennaHead-*.dmg

      - name: Publish release (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/gfa-') }}
        uses: softprops/action-gh-release@v2
        with:
          files: Gqrx-for-AntennaHead-*.dmg
          body: |
            Unofficial interim build: official Gqrx + PRs #1463 / #1464 / #1446.
            See AntennaHead `Docs/GQRX_FOR_ANTENNAHEAD_BUILD.md`.
